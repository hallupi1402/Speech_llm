[project]
name = "personaplex-phase3-research"
version = "0.1.0"
description = "P03 scenario, PersonaPlex rollout, and evaluation tools"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.5,<3.11",
    "numpy>=1.26,<2.2",
    "sphn>=0.1.4,<0.2",
]

[project.scripts]
phase3-p03 = "phase3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

